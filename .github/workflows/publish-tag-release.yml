name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Create Git Tag & GitHub Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/swift-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version from CHANGELOG
        id: version
        run: |
          VERSION=$(sed -n 's/^## \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CHANGELOG.md | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

      - name: Check tag doesn't already exist
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

          # Only this version's section. Falls back to generated notes when the
          # heading isn't a bare `## X.Y.Z`.
          NOTES=$(scripts/extract-changelog.sh CHANGELOG.md "$VERSION" || true)

          # 0.x releases stay marked as pre-releases, as 0.1.0 and 0.1.1 were.
          PRERELEASE=()
          if [ "${VERSION%%.*}" = "0" ]; then
            PRERELEASE=(--prerelease)
          fi

          if [ -z "$NOTES" ]; then
            gh release create "${VERSION}" \
              --title "${VERSION}" \
              "${PRERELEASE[@]}" \
              --generate-notes
          else
            gh release create "${VERSION}" \
              --title "${VERSION}" \
              "${PRERELEASE[@]}" \
              --notes "$NOTES"
          fi
