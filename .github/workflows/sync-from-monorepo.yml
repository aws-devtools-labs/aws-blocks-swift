name: Sync release from aws-blocks

# Pulls a tagged Swift SDK release from the public aws/cdk-blocks repo and opens a
# release PR here. Merging that PR runs the Release workflow, which creates the
# <version> tag that Swift Package Manager resolves.
#
# Before the first run, an admin must turn on "Allow GitHub Actions to create
# and approve pull requests" in Settings > Actions > General. Without it, the
# PR can't be opened.
#
# Two jobs, so that code from cdk-blocks never runs while a write token exists:
# - `prepare` has a read-only token. It checks that the swift@<version> tag is
#   the merged release commit, runs the cdk-blocks sync script against a
#   checkout of this repo, and uploads the staged change and the PR body.
# - `open-pr` has the write token. It runs no cdk-blocks code: it applies the
#   staged change to a fresh checkout, then pushes the branch and opens the PR.
# cdk-blocks is public, so reading it needs no extra credential.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Swift SDK version to sync (cdk-blocks tag swift@<version>), for example 0.2.0
        required: true
        type: string

concurrency:
  group: sync-from-monorepo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base-sha: ${{ steps.stage.outputs.base-sha }}
    steps:
      # A dispatch from another branch would put that branch's .github and
      # license files into the release PR. Compare github.ref, because a tag
      # named main would also match github.ref_name.
      - name: Enforce main branch
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::This workflow can only run from main (got '${REF}')."
          exit 1

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Plain MAJOR.MINOR.PATCH only. The Release workflow reads the version
          # from the CHANGELOG heading and does not handle pre-release suffixes.
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::'$VERSION' is not a plain MAJOR.MINOR.PATCH version."
            exit 1
          fi
          if [ "$(printf '%s' "$VERSION" | wc -l)" -ne 0 ]; then
            echo "::error::Version contains a newline."
            exit 1
          fi

      - name: Checkout cdk-blocks at the swift@<version> tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aws/cdk-blocks
          ref: refs/tags/swift@${{ inputs.version }}
          path: monorepo
          # Full history, so the next step can check the tag is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is the merged release commit
        working-directory: monorepo
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          SHA=$(git rev-parse HEAD)
          # Full ref name: a tag called origin/main would win over the
          # remote-tracking branch if this said just origin/main.
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "::error::swift@${VERSION} is not reachable from cdk-blocks main."
            exit 1
          fi
          VERSION_IN_TAG=$(jq -r .version native/swift/package.json)
          if [ "$VERSION_IN_TAG" != "$VERSION" ]; then
            echo "::error::native/swift/package.json at the tag says ${VERSION_IN_TAG}, expected ${VERSION}."
            exit 1
          fi
          # swift@* tags can be moved by anyone with write access, so also require
          # that the tag points at the commit that merged release/swift-<version>
          # into main. (SHA comes from git rev-parse, so interpolating it is safe.)
          PR=$(gh api "repos/aws/cdk-blocks/commits/${SHA}/pulls" \
            --jq ".[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"${SHA}\" and .head.ref == \"release/swift-${VERSION}\") | .number")
          if [ -z "$PR" ]; then
            echo "::error::swift@${VERSION} (${SHA}) is not the merge commit of a release/swift-${VERSION} PR."
            exit 1
          fi
          echo "Tag matches cdk-blocks PR #${PR}."

      - name: Checkout cdk-blocks-swift
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mirror
          fetch-depth: 0
          persist-credentials: false

      - name: Guard against an existing or older release
        working-directory: mirror
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists."
            exit 1
          fi
          if git rev-parse -q --verify "refs/remotes/origin/release/swift-${VERSION}" >/dev/null; then
            echo "::error::Branch release/swift-${VERSION} already exists. Open the PR from it by hand, or delete it and re-run."
            exit 1
          fi
          # Plain versions only, so a hand-made 0.2.0-rc.1 tag doesn't count as newer than 0.2.0.
          LATEST=$(git tag --list | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::${VERSION} is not newer than the latest release ${LATEST}."
            exit 1
          fi

      - name: Sync files
        run: monorepo/native/swift/scripts/sync-to-mirror.sh mirror

      - name: Stage the change and render the PR body
        id: stage
        working-directory: mirror
        env:
          VERSION: ${{ inputs.version }}
          OUT: ${{ runner.temp }}/release
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No changes to sync."
            exit 1
          fi
          git diff --cached --binary > "$OUT/sync.patch"
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          ../monorepo/native/swift/scripts/extract-changelog.sh CHANGELOG.md "$VERSION" \
            | ../monorepo/native/swift/scripts/render-release-body.sh target "$VERSION" > "$OUT/body.md"

      - name: Upload the staged change
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.version }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 1

  open-pr:
    name: Open release PR
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout cdk-blocks-swift
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the change was staged against.
          ref: ${{ needs.prepare.outputs.base-sha }}
          persist-credentials: false

      - name: Download the staged change
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.version }}
          path: ${{ runner.temp }}/release

      - name: Push and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          IN: ${{ runner.temp }}/release
        run: |
          BRANCH="release/swift-${VERSION}"

          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git apply --index --binary "$IN/sync.patch"
          git commit -m "chore: release ${VERSION}"
          git push origin "$BRANCH"

          # If the PR can't be opened, remove the branch so a plain re-run works.
          if ! gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: release ${VERSION}" \
              --body-file "$IN/body.md"; then
            echo "::error::Could not open the PR. If Actions can't create pull requests here, enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General."
            git push origin --delete "$BRANCH"
            exit 1
          fi
